<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Melodi-Flowershop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">Melodi-Flowershop</a>
        </div>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="produktet.html">Products</a></li>
                <li><a href="login.html">Log In</a></li>
                <li><a href="register.html" aria-current="page">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <h1>Create an Account</h1>

        <p class="form-status" role="status"></p>
        <form class="auth-form">
            <div class="form-field">
                <label for="register-name">Full name</label>
                <input
                    type="text"
                    id="register-name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-field">
                <label for="register-email">Email address</label>
                <input
                    type="email"
                    id="register-email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-field">
                <label for="register-password">Password</label>
                <input
                    type="password"
                    id="register-password"
                    autocomplete="new-password"
                    minlength="8"
                    aria-describedby="password-hint"
                    required
                >
                <small id="password-hint">Use at least 8 characters.</small>
            </div>

            <button class="btn" type="submit">Register</button>
        </form>

        <p>Already have an account? <a href="login.html">Log in</a>.</p>
    </main>

    <footer>
        <div class="footer-content">
            <p>Melodi-Flowershop</p>
            <a href="rreth-nesh.html">About Us</a>
        </div>
    </footer>
</body>
</html>
